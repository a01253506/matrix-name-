<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matrix</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const c = document.getElementById("c");
  const ctx = c.getContext("2d");
  const size = 16;   // digit size in px
  let drops = [];

  function resize() {
    c.width = window.innerWidth;
    c.height = window.innerHeight;
    drops = Array(Math.floor(c.width / size)).fill(0);
  }
  window.addEventListener("resize", resize);
  resize();

  function draw() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.08)";   // fade trail
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = "#0f0";                   // green
    ctx.font = size + "px monospace";
    for (let i = 0; i < drops.length; i++) {
      const ch = Math.floor(Math.random() * 10);
      ctx.fillText(ch, i * size, drops[i] * size);
      if (drops[i] * size > c.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  setInterval(draw, 50);   // speed in ms
</script>
</body>
</html>
